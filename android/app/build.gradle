apply plugin: "com.android.application"

android {
 compileSdkVersion 33

 defaultConfig {
 applicationId "com.sonor.music"
 minSdkVersion 21
 targetSdkVersion 33
 versionCode 1
 versionName "1.0.0"
 }

 buildTypes {
 release {
 minifyEnabled true
 proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
 }
 }

 packagingOptions {
 pickFirst "**"
 }
}

dependencies {
 implementation "com.facebook.react:react-native:+"
}