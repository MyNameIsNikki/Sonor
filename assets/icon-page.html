<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<script>
// assets/icon.svg инлайнится сервером? Нет — загружаем и вставляем на месте.
fetch('/assets/icon.svg').then(function (r) { return r.text(); }).then(function (svg) {
  var host = document.createElement('div');
  host.innerHTML = svg;
  document.body.appendChild(host.firstChild);
});
</script>
</body>
</html>
