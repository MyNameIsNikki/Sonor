name: Release candidate

on:
  workflow_dispatch:

jobs:
  release:
    name: Build and test release candidate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npx electron-builder --win --config electron-builder.config.js --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # latest.yml и *.blockmap обязательны для автообновления. Публикацию
      # выполняет человек после проверки: автоматическая публикация по тегу
      # отключена, чтобы CI не перезаписывал уже проверенные файлы релиза.
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: sonor-windows-release
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
